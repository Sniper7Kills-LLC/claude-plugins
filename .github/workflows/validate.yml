name: Validate

# Runs on every change headed for dev or main. It catches the failures that are silent
# at runtime: a skill whose frontmatter does not parse, a marketplace entry whose version
# disagrees with plugin.json, and a documentation link that points at a missing file.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Test the validator's own checks
        run: python3 scripts/test-validate.py

      - name: Test the peer detector
        run: python3 scripts/test-peers.py

      - name: Test the spawn guard hook
        run: python3 scripts/test-guard-spawn.py

      - name: Test the preflight hook
        run: python3 scripts/test-preflight.py

      - name: Test the spec renderer
        run: python3 scripts/test-render-spec.py

      - name: Test the claim verifier
        run: python3 scripts/test-verify-claim.py

      - name: Test the state CAS helper
        run: python3 scripts/test-state-cas.py

      - name: Test the CI-execution verifier
        run: python3 scripts/test-verify-ci-ran.py

      - name: Validate manifests, frontmatter and links
        run: python3 scripts/validate-manifests.py
